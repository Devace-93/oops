# Production overrides. oops shares the Hetzner box with the 3m4 shortener
# (and exp, retro, metrics), whose Caddy already owns ports 80/443. oops
# therefore runs WITHOUT its own Caddy in production: api, web and mcp join
# the external `edge` network and the 3m4 Caddyfile.prod routes oops.3m4.net
# to them by container name (oops-api-1, oops-web-1, oops-mcp-1).
#
# No geo database: oops does not look up locations.
#
#   docker network create edge            # once per server
#   cd /opt/oops/deploy
#   docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  caddy:
    profiles: ["disabled"]

  api:
    networks: [default, edge]
  web:
    networks: [default, edge]
  mcp:
    networks: [default, edge]

networks:
  edge:
    external: true
