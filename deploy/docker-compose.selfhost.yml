name: oops

# Self-host overlay: NO billing.
#   docker compose -f docker-compose.yml -f docker-compose.selfhost.yml up -d
# Set BILLING_ENABLED=false in .env. The frontend hides the billing page and
# plan limits come from config (default: selfhost = unlimited).

services:
  api:
    environment:
      BILLING_ENABLED: "false"

  web:
    environment:
      VITE_BILLING_ENABLED: "false"
